{{- if .Values.playwright.enabled }}
# Playwright browser-automation extension server. Drives the Selenium node over
# CDP; screenshots flow back through the agent's file.ingest RPC as durable
# file:<code>. One context per browser session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-extension
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: playwright-extension
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-extension
  template:
    metadata:
      labels:
        {{- include "abcp-agent.labels" . | nindent 8 }}
        app: playwright-extension
    spec:
      securityContext: {}
      containers:
        - name: playwright-extension
          image: {{ .Values.playwright.image.repository }}:{{ .Values.playwright.image.tag }}
          imagePullPolicy: {{ .Values.playwright.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ include "abcp-agent.natsUrl" . | quote }}
            - name: PLAYWRIGHT_SELENIUM_URL
              value: {{ .Values.infra.seleniumUrl | quote }}
            - name: PLAYWRIGHT_BROWSER
              value: chrome
            - name: PLAYWRIGHT_VIEWPORT
              value: {{ .Values.playwright.viewport | quote }}
            - name: PLAYWRIGHT_IDLE_TIMEOUT_MS
              value: {{ .Values.playwright.idleTimeoutMs | quote }}
            - name: PLAYWRIGHT_MAX_CONTEXTS
              value: {{ .Values.playwright.maxContexts | quote }}
          ports:
            - { containerPort: 8080, protocol: TCP }
          resources:
            {{- toYaml .Values.playwright.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-extension
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: playwright-extension
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
