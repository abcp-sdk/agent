{{- if .Values.workerExtension.enabled }}
# Worker extension server: run commands / read-write files (worker-*) AND drive
# a native GUI through the accessibility tree (computer-*) in the SAME
# config-registered easyworker sandboxes. Speaks only the abc protocol over NATS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abcp-agent.prefix" . }}worker-extension
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: {{ include "abcp-agent.prefix" . }}worker-extension
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "abcp-agent.prefix" . }}worker-extension }
  template:
    metadata:
      labels:
        {{- include "abcp-agent.labels" . | nindent 8 }}
        app: {{ include "abcp-agent.prefix" . }}worker-extension
    spec:
      securityContext: {}
      containers:
        - name: {{ include "abcp-agent.prefix" . }}worker-extension
          image: {{ .Values.workerExtension.image.repository }}:{{ .Values.workerExtension.image.tag }}
          imagePullPolicy: {{ .Values.workerExtension.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ include "abcp-agent.natsUrl" . | quote }}
            - name: PORT
              value: "8080"
          ports:
            - { containerPort: 8080, protocol: TCP }
          resources:
            {{- toYaml .Values.workerExtension.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "abcp-agent.prefix" . }}worker-extension
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: {{ include "abcp-agent.prefix" . }}worker-extension }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
{{- end }}
