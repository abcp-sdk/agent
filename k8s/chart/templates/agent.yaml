apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: {{ .Values.agent.service.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.agent.service.name }}
  template:
    metadata:
      labels:
        {{- include "abcp-agent.labels" . | nindent 8 }}
        app: {{ .Values.agent.service.name }}
    spec:
      serviceAccountName: {{ include "abcp-agent.saName" . }}
      securityContext: {}
      containers:
        # ---- abcp agent (session/model/turn engine; h2c only) ----
        - name: agent
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ include "abcp-agent.natsUrl" . | quote }}
            - name: DB_BACKEND
              value: sqlite
            - name: DATABASE_URL
              value: sqlite:///data/agent.db
            - name: PORT
              value: {{ .Values.agent.port | quote }}
            # h2c: in-cluster clients (extensions, gateways, the Caddy
            # aggregator) speak cleartext HTTP/2 prior-knowledge.
            - name: HTTP_PROTOCOL
              value: h2c
            - name: AGENT_CORS_ORIGIN
              value: {{ .Values.agent.corsOrigin | quote }}
            - name: AGENT_AUTH_MODE
              value: "required"
            - name: AGENT_ADMIN_TOKEN
              value: {{ .Values.agent.auth.adminToken | quote }}
            - name: AGENT_BOOTSTRAP_TENANT
              value: {{ .Values.agent.auth.bootstrapTenant | quote }}
            - name: AGENT_BOOTSTRAP_TOKEN
              value: {{ .Values.agent.auth.bootstrapToken | quote }}
            {{- if .Values.agent.disabledTools }}
            - name: DISABLED_TOOLS
              value: {{ .Values.agent.disabledTools | quote }}
            {{- end }}
            # Seed deployment-pinned extension config into the `cfg` KV
            # (create-if-absent; a UI-set value always wins) so the tools work
            # out of the box. `tenant: "*"` fans out to every known tenant.
            {{- if or .Values.playwright.enabled .Values.workerExtension.enabled .Values.bundled.seedTenant }}
            - name: AGENT_EXT_CONFIG_SEED
              value: {{ list
                (dict "tenant" .Values.playwright.seedTenant "extId" "playwright" "name" "selenium-url" "value" .Values.infra.seleniumUrl)
                (dict "tenant" .Values.workerExtension.seedTenant "extId" "worker" "name" "worker-url" "value" (include "abcp-agent.workerUrl" .))
                (dict "tenant" .Values.workerExtension.seedTenant "extId" "worker" "name" "worker-token" "value" .Values.worker.token)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.text" "value" .Values.bundled.model.text)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.image" "value" .Values.bundled.model.image)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.image_edit" "value" .Values.bundled.model.imageEdit)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.video" "value" .Values.bundled.model.video)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.speech" "value" .Values.bundled.model.speech)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.speech_clone" "value" .Values.bundled.model.speechClone)
                (dict "tenant" .Values.bundled.seedTenant "extId" "bundled" "name" "model.transcription" "value" .Values.bundled.model.transcription)
                | toJson | quote }}
            {{- end }}
            {{- include "abcp-agent.objectStoreEnv" . | nindent 12 }}
            {{- include "abcp-agent.egressProxyEnv" . | nindent 12 }}
          ports:
            - { containerPort: {{ .Values.agent.port }}, protocol: TCP }
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - { mountPath: /data, name: data, subPath: {{ .Values.persistence.subPath }} }
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: {{ .Values.persistence.type }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.agent.service.name }}
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agent.service.type }}
  selector:
    app: {{ .Values.agent.service.name }}
  ports:
    - name: h2c
      port: 80
      targetPort: {{ .Values.agent.port }}
      # Signal to an L7 proxy/ingress that this backend speaks cleartext
      # HTTP/2 (h2c), so it must NOT downgrade the upstream to HTTP/1.1.
      appProtocol: kubernetes.io/h2c
