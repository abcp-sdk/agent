apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-webui
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: agent-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-webui
  template:
    metadata:
      labels:
        {{- include "abcp-agent.labels" . | nindent 8 }}
        app: agent-webui
    spec:
      containers:
        - name: webui
          image: {{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          env:
            # Caddy reverse-proxies /agent.v1.* here over h2c.
            - name: AGENT_UPSTREAM
              value: {{ printf "%s.%s.svc.cluster.local:80" .Values.agent.service.name (include "abcp-agent.namespace" .) | quote }}
          ports:
            - { containerPort: {{ .Values.webui.port }}, protocol: TCP }
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.webui.port }} }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.webui.service.name }}
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webui.service.type }}
  selector:
    app: agent-webui
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.webui.port }}
