{{- if .Values.computerUse.enabled }}
# Computer-use extension server: read and drive native desktop apps through
# their accessibility trees (xa11y) in ANY sandbox registered in config. It
# owns no GUI: it drives remote agent-workers over worker.v1. The registered
# sandboxes are seeded into the `cfg` KV as `computer-use.sandboxes` (a JSON
# list of {name,url,token}). There is no sandbox-creation tool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abcp-agent.prefix" . }}computer-use-extension
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
    app: {{ include "abcp-agent.prefix" . }}computer-use-extension
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "abcp-agent.prefix" . }}computer-use-extension }
  template:
    metadata:
      labels:
        {{- include "abcp-agent.labels" . | nindent 8 }}
        app: {{ include "abcp-agent.prefix" . }}computer-use-extension
    spec:
      securityContext: {}
      containers:
        - name: {{ include "abcp-agent.prefix" . }}computer-use-extension
          image: {{ .Values.computerUse.image.repository }}:{{ .Values.computerUse.image.tag }}
          imagePullPolicy: {{ .Values.computerUse.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ include "abcp-agent.natsUrl" . | quote }}
            - name: PORT
              value: "8080"
          ports:
            - { containerPort: 8080, protocol: TCP }
          resources:
            {{- toYaml .Values.computerUse.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "abcp-agent.prefix" . }}computer-use-extension
  namespace: {{ include "abcp-agent.namespace" . }}
  labels:
    {{- include "abcp-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: {{ include "abcp-agent.prefix" . }}computer-use-extension }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
{{- end }}
