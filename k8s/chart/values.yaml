# Values for the standalone ABCP agent stack.
#
# This chart is AGENT-SIDE ONLY. Shared infrastructure (NATS, S3/Garage,
# Forgejo, Selenium, buildkitd, Postgres) lives in the separate `infra-chart`
# and is consumed here purely over Service DNS. Nothing infra-ish is deployed
# from this chart.
#
# Topology (namespace `agent`, co-located with the infra release):
#   - `standalone-agent` Pod: agent (h2c) + in-process bundled extension.
#   - `agent` Pod: Caddy aggregator (h1) serving the webui and reverse-proxying
#     `/agent.v1.*` to the agent over h2c (same-origin browser API).
#   - `playwright-extension` Pod: browser tool server (drives infra Selenium).
#   - `worker` Pod: a fixed easyworker sandbox the `worker-extension` drives.
#   - `worker-extension` Pod: run commands / read-write files in that worker.

namespaceOverride: ""

# ---- shared infra endpoints (the `infra` release, same namespace) ----
# All references are in-cluster Service DNS; the infra chart owns the pods.
infra:
  # NATS account `agent` (per-application JetStream isolation).
  nats:
    host: "nats.agent.svc.cluster.local"
    port: 4222
    user: "agent"
    password: "devpassword"
  # Garage S3 (durable file bytes). In-cluster plain HTTP.
  s3:
    bucket: "standalone-agent"
    region: "garage"
    endpoint: "http://s3.agent.svc.cluster.local"
    accessKey: "GK66c166f3602ec6b5e762b21c"
    secretKey: "685de4030127ea45b789396a1113e3b54f329e8e028ed4f47d0fbcd02da58c22"
    pathStyle: true
    prefix: "abcp"
  # Selenium WebDriver the playwright extension drives over CDP.
  seleniumUrl: "http://selenium.agent.svc.cluster.local:4444"
  # Outbound HTTP(S) proxy (infra mihomo). The agent loads the bundled
  # web-fetch / brave-search tools IN-PROCESS, so its Node fetch must egress
  # through this proxy (NODE_USE_ENV_PROXY=1 makes Node honor it).
  proxy:
    http: "http://mihomo.develop.svc.cluster.local:7890"
    https: "http://mihomo.develop.svc.cluster.local:7890"

# ---- agent (h2c) ----
agent:
  image:
    repository: git.agent.fenjin.org/abcp/agent
    tag: "20260922113939"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    # In-cluster h2c endpoint. The edge maps the public `standalone-agent` host
    # here; extensions/other backends dial it over h2c directly.
    name: standalone-agent
    type: ClusterIP
  corsOrigin: "*"
  # Tools the host hard-disables for every session.
  disabledTools: ""
  # Bearer-token auth. `required`, with a static admin token + a bootstrapped
  # first tenant (token -> tenant).
  auth:
    adminToken: "dev-admin-token"
    bootstrapTenant: "default"
    bootstrapToken: "devtenanttoken"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# ---- webui + Caddy aggregator (h1) ----
webui:
  image:
    # Caddy with the webui static build baked into /srv.
    repository: git.agent.fenjin.org/abcp/agent-webui
    tag: "20260922105807"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    name: agent
    type: ClusterIP
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ---- playwright browser-automation extension (separate server) ----
playwright:
  enabled: true
  image:
    repository: git.agent.fenjin.org/abcp/playwright-extension
    tag: "20260922031821"
    pullPolicy: IfNotPresent
  # Tenant the default is seeded for. `"*"` (default) seeds EVERY known tenant.
  seedTenant: "*"
  viewport: "1280x720"
  idleTimeoutMs: 600000
  maxContexts: 8
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# ---- bundled extension (in-process) model knobs ----
# Seeded into the `cfg` KV (create-if-absent; a UI-set value always wins) so
# image/video/speech/transcription tools work out of the box. Refs are
# canonical `provider_id/model_id` on the shared gateway.
bundled:
  # Tenant the defaults are seeded for. `"*"` (default) seeds EVERY tenant.
  seedTenant: "*"
  model:
    text: "gateway-text/tal-coding/deepseek-v4.1-flash"
    image: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    imageEdit: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    video: "gateway-video/local/minimax-h3-video"
    speech: "gateway-speech/mlops-tts-customvoice/qwen3-tts-customvoice"
    speechClone: "gateway-speech/mlops-tts-base/qwen3-tts-base"
    transcription: "gateway-transcription/mlops-asr/qwen3-asr"

# ---- fixed easyworker sandbox (worker-extension backend) ----
worker:
  enabled: true
  image:
    repository: git.agent.fenjin.org/root/easyworker
    tag: "alpine3.24-v0.5.2-12-ge6e069d"
    pullPolicy: IfNotPresent
  service:
    name: worker
    type: ClusterIP
  # Container port the worker listens on (the easyworker convention); the
  # Service exposes 80 -> this so `worker-url` uses the plain :80 address.
  port: 48080
  workspace: /workspace
  # Bearer the worker requires; the extension is seeded with the SAME token.
  token: "devworker-token"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# ---- worker extension (run commands / read-write files via easyworker) ----
workerExtension:
  enabled: true
  image:
    repository: git.agent.fenjin.org/abcp/worker-extension
    tag: "20260922031821"
    pullPolicy: IfNotPresent
  # Tenant the worker-url/-token defaults are seeded for. `"*"` = every tenant.
  seedTenant: "*"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ---- persistence ----
# The agent keeps its sqlite DB on a hostPath (sessions/messages survive
# restarts). Set persistence.enabled=false to run fully ephemeral.
persistence:
  enabled: true
  # hostPath root for /data (single-node dev cluster). DirectoryOrCreate.
  hostPath: /home/develop/.easylab
  subPath: agent-data
  type: DirectoryOrCreate

# ---- RBAC ----
serviceAccount:
  create: true
  name: "abcp-agent"
