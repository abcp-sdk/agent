# Values for the standalone ABCP agent stack.
#
# This chart is AGENT-SIDE ONLY. Shared infrastructure (NATS, S3/Garage,
# Forgejo, Selenium, buildkitd, Postgres) lives in the separate `infra-chart`
# and is consumed here purely over Service DNS. Nothing infra-ish is deployed
# from this chart.
#
# Topology (namespace `agent`, co-located with the infra release):
#   - `standalone-agent` Pod: agent (h2c) + in-process bundled extension.
#   - `agent` Pod: Caddy aggregator (h1) serving the webui and reverse-proxying
#     `/agent.v1.*` to the agent over h2c (same-origin browser API).
#   - `playwright-extension` Pod: browser tool server (drives infra Selenium).
#   - `worker` Pod: a fixed easyworker sandbox the `worker-extension` drives.
#   - `worker-extension` Pod: run commands / read-write files in that worker.

namespaceOverride: ""

# Object-name prefix so a SECOND agent stack can coexist in the SAME namespace
# (the `agent` namespace) with distinct object names, e.g. `s2-`. Empty = the
# original names (`standalone-agent`, `worker`, ...). The Service names below
# must ALSO be prefixed in the values file.
namePrefix: ""

# ---- shared infra endpoints (the `infra` release, same namespace) ----
# All references are in-cluster Service DNS; the infra chart owns the pods.
infra:
  # NATS account `agent` (per-application JetStream isolation).
  nats:
    host: "nats.agent.svc.cluster.local"
    port: 4222
    user: "agent"
    password: "devpassword"
  # Garage S3 (durable file bytes). In-cluster plain HTTP.
  s3:
    bucket: "standalone-agent"
    region: "garage"
    endpoint: "http://s3.agent.svc.cluster.local"
    accessKey: "GK66c166f3602ec6b5e762b21c"
    secretKey: "685de4030127ea45b789396a1113e3b54f329e8e028ed4f47d0fbcd02da58c22"
    pathStyle: true
    prefix: "abcp"
  # Selenium WebDriver the playwright extension drives over CDP.
  seleniumUrl: "http://selenium.agent.svc.cluster.local:4444"
  # Outbound HTTP(S) proxy (infra mihomo). The agent loads the bundled
  # web-fetch / brave-search tools IN-PROCESS, so its Node fetch must egress
  # through this proxy (NODE_USE_ENV_PROXY=1 makes Node honor it).
  proxy:
    http: "http://mihomo.develop.svc.cluster.local:7890"
    https: "http://mihomo.develop.svc.cluster.local:7890"

# ---- agent (h2c) ----
agent:
  image:
    repository: git.agent.svc.cluster.local/abcp/agent
    tag: "20260927103748"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    # In-cluster h2c endpoint. The edge maps the public `standalone-agent` host
    # here; extensions/other backends dial it over h2c directly.
    name: standalone-agent
    type: ClusterIP
  corsOrigin: "*"
  # Tools the host hard-disables for every session.
  disabledTools: ""
  # Idle-turn watchdog: re-trigger a session whose tip is an assistant step
  # ending on a `tool_result` (the model ran a tool then stopped) by publishing
  # a `system:idlewatch` mailbox trigger. Interval is a Go-style duration
  # (e.g. "2m", "120s"). Enabled by default.
  idlewatch:
    enabled: true
    interval: "2m"
  # Bearer-token auth. `required`, with a static admin token + a bootstrapped
  # first tenant (token -> tenant).
  auth:
    adminToken: "dev-admin-token"
    bootstrapTenant: "default"
    bootstrapToken: "devtenanttoken"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Metadata backend. `sqlite` (default) keeps the DB under /data (needs the
  # persistence volume). `pg` uses an external Postgres (no /data needed) and
  # ignores persistence.
  db:
    backend: sqlite
    postgres:
      host: "postgres.agent.svc.cluster.local"
      port: 5432
      user: "root"
      password: "devpassword"
      database: "abcp_agent"

# ---- webui + Caddy aggregator (h1) ----
webui:
  image:
    # Caddy with the webui static build baked into /srv.
    repository: git.agent.svc.cluster.local/abcp/agent-webui
    tag: "20260926073337"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    name: agent
    type: ClusterIP
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ---- playwright browser-automation extension (separate server) ----
playwright:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/playwright-extension
    tag: "20260922031821"
    pullPolicy: IfNotPresent
  # Tenant the default is seeded for. `"*"` (default) seeds EVERY known tenant.
  seedTenant: "*"
  viewport: "1280x720"
  idleTimeoutMs: 600000
  maxContexts: 8
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# ---- bundled extension (in-process) model knobs ----
# Seeded into the `cfg` KV (create-if-absent; a UI-set value always wins) so
# image/speech/transcription tools work out of the box. Refs are canonical
# `provider_id/model_id` on the shared gateway. There is NO `video` default:
# the gray gateway serves no video model, so `video-generate` stays unset
# until a video-capable provider is registered and the knob is set.
bundled:
  # Tenant the defaults are seeded for. `"*"` (default) seeds EVERY tenant.
  seedTenant: "*"
  model:
    text: "gateway-text/tal-coding/deepseek-v4.1-flash"
    image: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    imageEdit: "gateway-image/tal-coding-gptimage/gpt-image-2.5-flare"
    speech: "gateway-speech/mlops-tts-customvoice/qwen3-tts-customvoice"
    speechClone: "gateway-speech/mlops-tts-base/qwen3-tts-base"
    transcription: "gateway-transcription/mlops-asr/qwen3-asr"

# ---- computer-use extension (drive native GUI apps via accessibility) ----
# Off by default (most deployments have no GUI sandbox). When enabled, seed
# `sandboxes` (a JSON list of {name,url,token}) so the model can drive any
# registered agent-worker with a desktop. `seedTenant: "*"` fans out to every
# known tenant.
computerUse:
  enabled: false
  image:
    repository: git.agent.svc.cluster.local/abcp/computer-use-extension
    tag: "20260928120000"
    pullPolicy: IfNotPresent
  seedTenant: "*"
  # JSON list of agent-worker endpoints the extension may drive.
  sandboxes: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ---- fixed easyworker sandbox (worker-extension backend) ----
worker:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/agent-worker
    tag: "20260924170523"
    pullPolicy: IfNotPresent
  service:
    name: worker
    type: ClusterIP
  # Container port the worker listens on (the easyworker convention); the
  # Service exposes 80 -> this so `worker-url` uses the plain :80 address.
  port: 48080
  # Empty = the worker's own default (~/workspace, i.e. /root/workspace in the
  # container). Set an explicit path to pin the workspace root.
  workspace: ""
  # Bearer the worker requires; the extension is seeded with the SAME token.
  token: "devworker-token"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 1Gi }

# ---- worker extension (run commands / read-write files via easyworker) ----
workerExtension:
  enabled: true
  image:
    repository: git.agent.svc.cluster.local/abcp/worker-extension
    tag: "20260928130000"
    pullPolicy: IfNotPresent
  # Tenant the worker-url/-token defaults are seeded for. `"*"` = every tenant.
  seedTenant: "*"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ---- persistence ----
# The agent keeps its sqlite DB under /data (sessions/messages survive
# restarts). With db.backend=pg the agent needs NO /data volume (the DB lives
# in Postgres), so this is only mounted in sqlite mode. `mode` selects the
# volume kind: `hostPath` (legacy single-node dev) or `pvc` (per-stack PVC on
# storageClass). Set enabled=false for a fully ephemeral sqlite agent.
persistence:
  enabled: true
  mode: hostPath          # hostPath | pvc
  storageClass: workspace-local
  size: 2Gi
  # hostPath root for /data (single-node dev cluster). DirectoryOrCreate.
  hostPath: /home/develop/.easylab
  subPath: agent-data
  type: DirectoryOrCreate

# ---- RBAC ----
serviceAccount:
  create: true
  name: "abcp-agent"
