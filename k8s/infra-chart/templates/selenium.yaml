{{- $svc := .Values.selenium -}}
{{- $g := .Values.global -}}
{{- $p := include "agent.prefix" . -}}
{{- if $svc.enabled }}
{{- if eq $g.persistence "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $p }}selenium-data
  namespace: {{ .Values.namespace }}
  labels: { app: {{ $p }}selenium }
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ include "agent.storageClass" . }}
  resources:
    requests:
      storage: {{ $svc.pvcSize | default "2Gi" }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $p }}selenium
  namespace: {{ .Values.namespace }}
  labels: { app: {{ $p }}selenium }
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ $p }}selenium } }
  template:
    metadata: { labels: { app: {{ $p }}selenium } }
    spec:
      containers:
      - name: selenium
        image: {{ $svc.image }}
        imagePullPolicy: {{ $g.imagePullPolicy }}
        env:
        - { name: SE_NODE_MAX_SESSIONS, value: "4" }
        - { name: SE_NODE_OVERRIDE_MAX_SESSIONS, value: "true" }
        - { name: SE_NODE_SESSION_TIMEOUT, value: "1800" }
        - { name: SE_ENABLE_MANAGED_DOWNLOADS, value: "true" }
        {{- include "agent.proxyEnv" . | nindent 8 }}
        ports:
        - { name: http, containerPort: {{ $svc.port }} }
        volumeMounts:
        - { name: dshm, mountPath: /dev/shm }
        - { name: data, mountPath: /home/seluser/Downloads }
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: data
        {{- if eq $g.persistence "pvc" }}
        persistentVolumeClaim:
          claimName: {{ $p }}selenium-data
        {{- else }}
        hostPath:
          path: {{ $svc.dataPath }}
          type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $p }}selenium
  namespace: {{ .Values.namespace }}
  labels: { app: {{ $p }}selenium }
spec:
  selector: { app: {{ $p }}selenium }
  ports:
  - { name: http, port: {{ $svc.port }}, targetPort: {{ $svc.port }} }
{{- end }}
