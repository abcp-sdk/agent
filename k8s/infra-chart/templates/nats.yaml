{{- $svc := .Values.nats -}}
{{- $g := .Values.global -}}
{{- $p := include "agent.prefix" . -}}
{{- if $svc.enabled }}
{{- if eq $g.persistence "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $p }}nats-data
  namespace: {{ .Values.namespace }}
  labels: { app: {{ $p }}nats }
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ include "agent.storageClass" . }}
  resources:
    requests:
      storage: {{ $svc.pvcSize | default "2Gi" }}
---
{{- end }}
# One NATS account per application, so each has its OWN JetStream domain and
# cannot see another's streams/KV/objects. The standalone agent connects as
# account `agent` (user/pass); other apps get their own account later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $p }}nats-config
  namespace: {{ .Values.namespace }}
data:
  nats.conf: |
    port: {{ $svc.ports.client }}
    http_port: {{ $svc.ports.monitor }}
    jetstream {
      store_dir: "/data/nats"
    }
    accounts {
      agent {
        jetstream: enabled
        users: [ { user: "{{ $svc.agent.user }}", password: "{{ $svc.agent.password }}" } ]
      }
      workspace {
        jetstream: enabled
        users: [ { user: "{{ $svc.workspace.user }}", password: "{{ $svc.workspace.password }}" } ]
      }
      class {
        jetstream: enabled
        users: [ { user: "{{ $svc.class.user }}", password: "{{ $svc.class.password }}" } ]
      }
      {{- if $svc.extra }}
      {{- range $svc.extra }}
      {{ .name }} {
        jetstream: enabled
        users: [ { user: "{{ .user }}", password: "{{ .password }}" } ]
      }
      {{- end }}
      {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $p }}nats
  namespace: {{ .Values.namespace }}
  labels: { app: {{ $p }}nats }
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ $p }}nats } }
  template:
    metadata: { labels: { app: {{ $p }}nats } }
    spec:
      containers:
      - name: nats
        image: {{ $svc.image }}
        imagePullPolicy: {{ $g.imagePullPolicy }}
        args: ["-c", "/etc/nats/nats.conf"]
        env:
        {{- include "agent.proxyEnv" . | nindent 8 }}
        ports:
        - { name: client, containerPort: {{ $svc.ports.client }} }
        - { name: monitor, containerPort: {{ $svc.ports.monitor }} }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: config, mountPath: /etc/nats, readOnly: true }
      volumes:
      - name: data
        {{- if eq $g.persistence "pvc" }}
        persistentVolumeClaim:
          claimName: {{ $p }}nats-data
        {{- else }}
        hostPath:
          path: {{ $svc.dataPath }}
          type: DirectoryOrCreate
        {{- end }}
      - name: config
        configMap: { name: {{ $p }}nats-config }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $p }}nats
  namespace: {{ .Values.namespace }}
  labels: { app: {{ $p }}nats }
spec:
  selector: { app: {{ $p }}nats }
  ports:
  - { name: client, port: {{ $svc.ports.client }}, targetPort: {{ $svc.ports.client }} }
  - { name: monitor, port: {{ $svc.ports.monitor }}, targetPort: {{ $svc.ports.monitor }} }
{{- end }}
